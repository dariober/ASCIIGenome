name: CI

on: [push]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [21, 27]

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          cache: gradle

      - name: Check Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Install samtools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools

      - name: Install samtools (macOS)
        if: runner.os == 'macOS'
        run: brew install samtools

      - name: Build and Test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            set -e
            ./gradlew clean build jacocoTestReport
            cp ASCIIGenome build/libs/
            cd src/test/java
            chmod a+x integration_test.py
            ./integration_test.py

      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bash <(curl -s https://codecov.io/bash)
